# docker-compose.yml para pYSFReflector3
# Autor: Jules (Asistente de IA)

version: '3.8'

services:
  ysfreflector:
    # Nombre del contenedor para una fácil identificación.
    container_name: ysfreflector

    # Construye la imagen a partir del Dockerfile en el directorio actual.
    build:
      context: .
      dockerfile: Dockerfile

    # Política de reinicio. 'always' asegura que el reflector se inicie
    # automáticamente con Docker y se reinicie si se detiene inesperadamente.
    restart: always

    # Mapeo de puertos.
    # Conecta el puerto 42000/udp del host al puerto 42000/udp del contenedor.
    # El protocolo UDP es el utilizado por el reflector para la comunicación de voz.
    ports:
      - "42000:42000/udp"

    # Variables de Entorno para la Configuración del Reflector.
    # El script 'entrypoint.sh' usará estas variables para generar el
    # fichero 'pysfreflector.ini' cada vez que el contenedor se inicie.
    # Modifica los valores según tus necesidades.
    environment:
      # --- Sección [Info] ---
      - INFO_NAME=YSF Reflector by Docker
      - INFO_DESCRIPTION=Dockerized pYSFReflector
      - INFO_CONTACT=
      - INFO_WEB=

      # --- Sección [Log] ---
      # Por defecto, los logs se envían a la consola de Docker.
      - LOG_DISPLAY_LEVEL=1
      - LOG_FILE_LEVEL=0

      # --- Sección [Network] ---
      - NETWORK_PORT=42000
      - NETWORK_JSON_IP=127.0.0.1
      - NETWORK_JSON_PORT=42001
      - NETWORK_DEBUG=0

      # --- Sección [Block List] ---
      - BLOCKLIST_TIME=0.5
      - BLOCKLIST_CHECK_RE=1

      # --- Sección [Protections] ---
      - PROTECTIONS_TIMEOUT=190
      - PROTECTIONS_WILD_PTT_TIME=5
      - PROTECTIONS_WILD_PTT_COUNT=4
      - PROTECTIONS_TREACTIVATE=900

      # --- Sección [APRS] ---
      - APRS_ENABLE=0
      - APRS_SERVER=aprs.grupporadiofirenze.net
      - APRS_PORT=14580
      - APRS_SSID=-10

      # --- Sección [DGID] ---
      - DGID_LIST=1,9,50
      - DGID_DEFAULT=50
      - DGID_LOCAL=1
      - DGID_AUX_PORT=
      - DGID_PREFIX=1
      - DGID_BTH_TIME=900.0

      # --- Sección [REFL_ALIAS] ---
      - REFL_ALIAS_01=

    # Volúmenes para persistencia de datos.
    # Se mantiene el volumen para deny.db, ya que es un fichero de datos
    # que se quiere gestionar desde el host.
    volumes:
      - ./deny.db:/opt/pysfreflector/deny.db
